@keyframes up{from{opacity:0;transform:translateY(16px)}}
@keyframes drift{to{transform:translate(4%,3%) scale(1.1)}}
body::before{content:"";position:fixed;inset:-20%;z-index:-1;pointer-events:none;background:radial-gradient(circle at 20% 20%,rgba(45,212,191,.14),transparent 40%),radial-gradient(circle at 80% 70%,rgba(132,204,22,.09),transparent 40%);animation:drift 16s ease-in-out infinite alternate}

.card{transition:transform .25s,box-shadow .25s,border-color .25s}

:root[data-theme="dark"]{--bg:#071316;--sf:#0e1d20;--tx:#ecfdf5;--mu:#8fb3a0;--ac:#34d399;--ac2:#a3e635;--ln:#1c3a38;--ink:#34d399;--sh:#065f46;--acf:#128a49;color-scheme:dark}

function san(h){

  if(c.nodeType==3)return;

  w(c);
  if(!OKT.has(c.tagName)){c.replaceWith(...c.childNodes);return}
  let st=(c.getAttribute("style")||"").split(";").map(x=>x.trim()).filter(x=>OKS.includes(x.split(":")[0].trim().toLowerCase())&&!/url\(|expression|javascript/i.test(x)).join(";");

  if(face)st+=";font-family:"+face.replace(/[^\w\s,\-"']/g,"");
  if(col&&/^#?\w+$/.test(col))st+=";color:"+col;
  if(st)c.setAttribute("style",st);
  if(c.tagName=="A"&&/^(https?:\/\/|mailto:)/i.test(href||"")){c.setAttribute("href",href);c.setAttribute("target","_blank");c.setAttribute("rel","noopener")}

 })};
 w(t.content);return t.innerHTML}
