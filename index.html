.card,.ev,.erow,.cd{animation:up .5s backwards}

function zip(fl){
 const en=new TextEncoder(),P=[],C=[];let off=0;
 for(const f of fl){const nm=en.encode(f.n),c=crc(f.d),L=f.d.length,h=new DataView(new ArrayBuffer(30));
  h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(12,0x21,true);h.setUint32(14,c,true);h.setUint32(18,L,true);h.setUint32(22,L,true);h.setUint16(26,nm.length,true);
  P.push(h.buffer,nm,f.d);
  const e=new DataView(new ArrayBuffer(46));
  e.setUint32(0,0x02014b50,true);e.setUint16(4,20,true);e.setUint16(6,20,true);e.setUint16(8,0x0800,true);e.setUint16(14,0x21,true);e.setUint32(16,c,true);e.setUint32(20,L,true);e.setUint32(24,L,true);e.setUint16(28,nm.length,true);e.setUint32(42,off,true);
  C.push(e.buffer,nm);off+=30+nm.length+L}
 const cs=C.reduce((a,b)=>a+b.byteLength,0),z=new DataView(new ArrayBuffer(22));
 z.setUint32(0,0x06054b50,true);z.setUint16(8,fl.length,true);z.setUint16(10,fl.length,true);z.setUint32(12,cs,true);z.setUint32(16,off,true);
 return new Blob([...P,...C,z.buffer],{type:"application/zip"})}
